name: CI Pipeline

# Hind AI — Gemma 4 AI-Powered Spiritual Learning Platform
# CI does not require local AI models; tests use mocks and isolated dependencies.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # Keep in sync with .nvmrc and package.json#engines.node. Pinning to the
  # current LTS avoids "future Node" warnings from setup-node.
  NODE_VERSION: "20"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Quality Checks
  # ==========================================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci --legacy-peer-deps

      - name: Run Prettier check
        run: npm run format:check

      - name: Run lint check
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: React Doctor Quality Audit (pull request)
        if: github.event_name == 'pull_request'
        timeout-minutes: 10
        run: npm run doctor -- --verbose --scope changed --base "origin/${{ github.base_ref }}"

      - name: React Doctor Quality Audit (push)
        if: github.event_name == 'push'
        timeout-minutes: 10
        run: |
          BASE_SHA="$(git rev-parse HEAD^)"
          npm run doctor -- --verbose --scope changed --base "$BASE_SHA"

  # ==========================================
  # Unit & Integration Tests
  # ==========================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    permissions:
      contents: read
    continue-on-error: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm run test

  # ==========================================
  # Production Build
  # ==========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci --legacy-peer-deps

      - name: Build GitHub Pages export
        run: npm run build:pages

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: build
          path: out/
          retention-days: 7
          if-no-files-found: ignore

  # ==========================================
  # E2E Tests (runs on pull requests and main branch)
  # ==========================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    timeout-minutes: 25
    permissions:
      contents: read
    continue-on-error: true
    env:
      PLAYWRIGHT_CHROMIUM_CHANNEL: chrome

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci --legacy-peer-deps

      - name: Verify system Chrome
        timeout-minutes: 2
        run: google-chrome --version

      - name: Install Playwright Chromium fallback
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: Run E2E tests
        timeout-minutes: 15
        run: npm run test:e2e

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

  # ==========================================
  # Deploy (GitHub Pages)
  # ==========================================
  # Static export is built in this workflow and deployed by
  # `.github/workflows/pages.yml` on push to main.
  #
  # App Router `/api/*` route handlers cannot run on GitHub Pages (no Node
  # server). Production Gemma traffic uses the Cloudflare Worker in
  # `workers/hindai-gemma`. The Pages build stashes `app/api` for
  # `output: 'export'` only.
