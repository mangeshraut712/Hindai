# Hosted scorer fields from HARNESS_README.md / Overview.
# Hidden set is about 120 tasks (Data page) under a 12-hour whole-run cap.
# 8 minutes per task would be ~16 hours of agent time alone. 4.5 minutes keeps
# 120 tasks at ~9 hours plus sandbox setup; command timeout 180s also bounds
# Phase-2 pytest.
evaluation:
  timeout_seconds: 180
  max_tool_calls: 40
  max_time_minutes: 4.5
  max_turns: 60
